name: build

on:
  push:
  pull_request:

jobs:
  impl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        impl: [svelte, react, solid, preact, vue, lit, angular, qwik, astro, ember, nextjs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.impl }}/package-lock.json

      # Secret files are gitignored, so CI recreates them from the committed
      # examples. angular needs environment.ts to compile; alpine needs
      # config.js for build.mjs staging; .env is optional everywhere.
      - name: Create env file from committed example
        working-directory: ${{ matrix.impl }}
        run: |
          [ -f .env.example ] && cp .env.example .env || true
          [ -f config.example.js ] && cp config.example.js config.js || true
          [ -f src/environments/environment.example.ts ] && cp src/environments/environment.example.ts src/environments/environment.ts || true

      - name: Install and build
        working-directory: ${{ matrix.impl }}
        run: npm ci && npm run build

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stage dist
        working-directory: alpine
        run: |
          cp config.example.js config.js
          node build.mjs
          test -f dist/alpine/index.html
          test -f dist/shared/weather.js

  vanilla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stage dist
        working-directory: vanilla
        run: |
          cp config.example.js config.js
          node build.mjs
          test -f dist/vanilla/index.html
          test -f dist/shared/weather.js

  deploy:
    needs: [impl, alpine, vanilla]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # Secret files are gitignored, so the deploy recreates them with the real
      # OWM key from the OWM_API_KEY repo secret. The key ships in public client
      # JS by design. If the secret is unset the key is empty and every impl
      # falls back to demo data.
      - name: Write API key config
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          for d in svelte react solid preact vue lit qwik ember; do
            echo "VITE_OWM_API_KEY=$OWM_API_KEY" > "$d/.env"
          done
          echo "PUBLIC_OWM_API_KEY=$OWM_API_KEY" > astro/.env
          echo "NEXT_PUBLIC_OWM_API_KEY=$OWM_API_KEY" > nextjs/.env
          printf "window.CONFIG = { API_KEY: '%s' }\n" "$OWM_API_KEY" > alpine/config.js
          cp alpine/config.js vanilla/config.js
          printf "export const environment = { owmApiKey: '%s' }\n" "$OWM_API_KEY" > angular/src/environments/environment.ts

      - name: Install impl dependencies
        run: |
          for d in svelte react solid preact vue lit angular qwik astro ember nextjs; do
            npm --prefix "$d" ci
          done

      - name: Build and stage site
        working-directory: site
        run: npm run build

      # Guard the deploy: catch missing staging and absolute asset refs that
      # would 404 under /<name>/ subpaths even though impl builds passed.
      - name: Verify staged output
        working-directory: site
        run: |
          test -f dist/stats.json
          for d in svelte react solid preact vue lit alpine angular vanilla qwik astro ember nextjs; do
            test -f "dist/$d/index.html"
          done
          ! grep -r 'src="/assets/' dist/*/index.html

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: weathernow-fab1e
          channelId: live
          entryPoint: site
