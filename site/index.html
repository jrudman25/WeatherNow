<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="WeatherNow: the same weather app implemented in several frontend frameworks, compared side by side."
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="site.css" />
    <title>WeatherNow: every framework</title>
  </head>
  <body>
    <main class="page">
      <h1 class="wordmark">WeatherNow</h1>
      <p class="tagline">
        The same weather app, implemented in <span id="count">several</span> frameworks.
        Click a name to open it; click a column header to sort.
      </p>

      <table class="stats">
        <thead>
          <tr>
            <th data-key="name" title="Framework folder in the repo. Click a name to open that app." data-label="Implementation"><button type="button">Implementation</button></th>
            <th class="num" data-key="jsGzip" title="All JavaScript the build emits (files plus inline scripts), gzipped. Code-split chunks count even if they load later." data-label="JS (gzip)"><button type="button">JS (gzip)</button></th>
            <th class="num" data-key="cssGzip" title="All CSS the build emits (files plus inline styles), gzipped." data-label="CSS (gzip)"><button type="button">CSS (gzip)</button></th>
            <th class="num" data-key="loc" title="Source lines in the implementation folder, including config. Excludes dependencies and build output." data-label="Lines of code"><button type="button">Lines of code</button></th>
            <th class="num" data-key="deps" title="Direct dependencies plus devDependencies in package.json." data-label="Dependencies"><button type="button">Dependencies</button></th>
            <th class="num" data-key="buildMs" title="Wall time of npm run build during the last site build." data-label="Build"><button type="button">Build</button></th>
            <th class="num" data-key="fcp" title="First Contentful Paint: time until the first text or image renders. Median of 5 cold loads in Chrome, throttled to Slow 4G and a 4x CPU slowdown at a 412px mobile viewport. Measured with npm run measure, not on every build." data-label="FCP"><button type="button">FCP</button></th>
            <th class="num" data-key="lcp" title="Largest Contentful Paint: time until the largest visible element renders. Median of 5 cold loads in Chrome, throttled to Slow 4G and a 4x CPU slowdown at a 412px mobile viewport. Measured with npm run measure, not on every build." data-label="LCP"><button type="button">LCP</button></th>
            <th class="num" data-key="tbt" title="Total Blocking Time: main-thread time after FCP spent in tasks over 50 ms, which delays input. Median of 5 cold loads in Chrome, throttled to Slow 4G and a 4x CPU slowdown at a 412px mobile viewport. Measured with npm run measure, not on every build." data-label="TBT"><button type="button">TBT</button></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="9" class="loading">loading stats…</td></tr>
        </tbody>
      </table>

      <p class="foot">
        Every implementation renders the identical app from
        <a href="https://github.com/jrudman25/WeatherNow">shared code</a>; only the
        framework's expression differs. Stats regenerate on each build<span id="measured"></span>.
      </p>
    </main>

    <script type="module">
      const KB = (n) => (n / 1024).toFixed(1) + ' kB'
      const MS = (n) => (n == null ? 'n/a' : n + ' ms')
      let data
      try {
        const res = await fetch('stats.json')
        if (!res.ok) throw new Error(`stats.json: HTTP ${res.status}`)
        data = await res.json()
      } catch (err) {
        document.getElementById('rows').innerHTML =
          '<tr><td colspan="9" class="loading">Could not load stats.</td></tr>'
        throw err
      }
      const { implementations, perf } = data
      const rows = Object.entries(implementations).map(([name, s]) => ({ name, ...s, ...perf?.results[name] }))
      document.getElementById('count').textContent = rows.length

      const tbody = document.getElementById('rows')
      const headers = [...document.querySelectorAll('th[data-key]')]
      let sortKey = 'name'
      let sortAsc = true

      const fmt = {
        name: (r) => `<a href="./${r.name}/">${r.name}</a>`,
        jsGzip: (r) => KB(r.jsGzip),
        cssGzip: (r) => KB(r.cssGzip),
        loc: (r) => r.loc,
        deps: (r) => r.deps,
        buildMs: (r) => (r.buildMs === null ? 'n/a' : (r.buildMs / 1000).toFixed(1) + 's'),
        fcp: (r) => MS(r.fcp),
        lcp: (r) => MS(r.lcp),
        tbt: (r) => MS(r.tbt),
      }

      function render() {
        rows.sort((a, b) => {
          if (a[sortKey] == null) return 1
          if (b[sortKey] == null) return -1
          const cmp = sortKey === 'name' ? a.name.localeCompare(b.name) : a[sortKey] - b[sortKey]
          return sortAsc ? cmp : -cmp
        })
        tbody.innerHTML = rows
          .map(
            (r) => `<tr>
            <td>${fmt.name(r)}</td>
            <td class="num">${fmt.jsGzip(r)}</td>
            <td class="num">${fmt.cssGzip(r)}</td>
            <td class="num">${fmt.loc(r)}</td>
            <td class="num">${fmt.deps(r)}</td>
            <td class="num">${fmt.buildMs(r)}</td>
            <td class="num">${fmt.fcp(r)}</td>
            <td class="num">${fmt.lcp(r)}</td>
            <td class="num">${fmt.tbt(r)}</td>
          </tr>`
          )
          .join('')
        headers.forEach((h) => {
          const active = h.dataset.key === sortKey
          h.querySelector('button').textContent = h.dataset.label + (active ? (sortAsc ? ' ▲' : ' ▼') : '')
          h.setAttribute('aria-sort', active ? (sortAsc ? 'ascending' : 'descending') : 'none')
        })
      }

      headers.forEach((h) =>
        h.querySelector('button').addEventListener('click', () => {
          if (sortKey === h.dataset.key) {
            sortAsc = !sortAsc
          } else {
            sortKey = h.dataset.key
            sortAsc = sortKey === 'name'
          }
          render()
        })
      )
      if (perf) document.getElementById('measured').textContent = '; load times measured ' + perf.measured.slice(0, 10)
      render()
    </script>
  </body>
</html>
